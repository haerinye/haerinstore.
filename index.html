<!DOCTYPE html>
<html lang="id">
<head>

    <style>
        * { box-sizing: border-box; transition: all 0.3s ease; }
        
        body {
            /* MENGGUNAKAN GIPHY SEBAGAI BACKGROUND */
            background-image: url('https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHI3Z2Z3ZnZ3ZnZ3ZnZ3ZnZ3ZnZ3ZnZ3ZnZ3ZnZ3ZnZ3ZnZ3/8e0da1707fdb144129cf2ecaa548475d/giphy.gif');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
        }

        /* Overlay transparan agar teks tetap terbaca jelas */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 230, 240, 0.3); 
            z-index: -1;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            width: 100%;
        }

        .logo-wrapper {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 50px;
            display: inline-block;
            border: 2px solid #ffb6c1;
        }

        h1 { margin: 0; color: #d81b60; letter-spacing: 4px; font-weight: 700; font-size: 2.5rem; }
        p { margin: 5px 0 0; color: #8b5e66; font-weight: 600; letter-spacing: 1px; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1000px;
            width: 100%;
        }

        .card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .card:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.8); }

        .app-name { display: block; font-size: 1.8rem; color: #d81b60; font-weight: 700; margin-bottom: 10px; }
        .price-box { border-top: 1px solid rgba(216, 27, 96, 0.2); padding-top: 10px; color: #555; }
        .price-box b { display: block; font-size: 1.3rem; color: #d81b60; margin-top: 5px; }

        footer { margin-top: 50px; display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 350px; }
        
        .btn {
            background: rgba(255, 255, 255, 0.8);
            color: #d81b60;
            text-decoration: none;
            padding: 15px;
            border-radius: 50px;
            font-weight: 700;
            text-align: center;
            border: 2px solid #ffb6c1;
        }

        .btn:hover { background: #d81b60; color: white; }
    </style>
</head>
<body>

    <header>

        <div class="card"><span class="app-name">YouTube Premium</span><div class="price-box">1 Bulan <b>Rp 2.500</b></div></div>
        <div class="card"><span class="app-name">Apple Music</span><div class="price-box">1 Bulan <b>Rp 10.000</b></div></div>
        <div class="card"><span class="app-name">Alight Motion</span><div class="price-box">1 Tahun <b>Rp 1.000</b></div></div>
        <div class="card"><span class="app-name">PicsArt Pro</span><div class="price-box">Private <b>Rp 5.000</b></div></div>
        <div class="card"><span class="app-name">CapCut Pro</span><div class="price-box">35 Hari <b>Rp 8.000</b></div></div>
        <div class="card"><span class="app-name">B-Station</span><div class="price-box">Sharing <b>Rp 5.000</b></div></div>
    </div>

    <footer>
        <a href="https://wa.me/628886179455" class="btn">Order via WhatsApp</a>
        <a href="https://discordapp.com/users/hearinye" target="_blank" class="btn">user hearinye</a>
    </footer>

</body>
</html>
